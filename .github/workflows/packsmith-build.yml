name: PackSmith v0.2.0 build
on:
  push:
    branches: [packsmith-build-v0.2.0]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone official MT v3 demo
        run: git clone --depth=1 https://gitee.com/L-JINBIN/mt-plugin-v3-demo.git /tmp/mt-demo
      - name: Install PackSmith source
        shell: bash
        run: |
          rm -rf /tmp/mt-demo/template/src/main/java/*
          rm -rf /tmp/packsmith-src && mkdir -p /tmp/packsmith-src
          cat .packsmith-build/binpart* > /tmp/packsmith-src.zip
          unzip -q /tmp/packsmith-src.zip -d /tmp/packsmith-src
          if [ -d .packsmith-build/patch/dev ]; then cp -a .packsmith-build/patch/dev/. /tmp/packsmith-src/dev/; fi
          cp -a /tmp/packsmith-src/dev/. /tmp/mt-demo/template/src/main/java/dev/
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('/tmp/mt-demo/template/build.gradle')
          s=p.read_text()
          start=s.index('mtPlugin {')
          i=start+s[start:].index('{')
          depth=0; end=None
          for j in range(i,len(s)):
              if s[j]=='{': depth+=1
              elif s[j]=='}':
                  depth-=1
                  if depth==0:
                      end=j+1; break
          interfaces = [
            'dev.packsmith.mt.BedrockIdentifierMenu',
            'dev.packsmith.mt.BumpPackVersionMenu',
            'dev.packsmith.mt.CopyHeaderUuidMenu',
            'dev.packsmith.mt.CreateAddonScaffoldMenu',
            'dev.packsmith.mt.CreateBpScaffoldMenu',
            'dev.packsmith.mt.CreateRpScaffoldMenu',
            'dev.packsmith.mt.FormatJsonMenu',
            'dev.packsmith.mt.GenerateAnimationControllerMenu',
            'dev.packsmith.mt.GenerateAnimationMenu',
            'dev.packsmith.mt.GenerateAttachableMenu',
            'dev.packsmith.mt.GenerateBehaviorPackMenu',
            'dev.packsmith.mt.GenerateBlockMenu',
            'dev.packsmith.mt.GenerateClientEntityMenu',
            'dev.packsmith.mt.GenerateEntityMenu',
            'dev.packsmith.mt.GenerateFunctionMenu',
            'dev.packsmith.mt.GenerateFurnaceRecipeMenu',
            'dev.packsmith.mt.GenerateItemMenu',
            'dev.packsmith.mt.GenerateLinkedBehaviorPackMenu',
            'dev.packsmith.mt.GenerateLootTableMenu',
            'dev.packsmith.mt.GenerateParticleMenu',
            'dev.packsmith.mt.GenerateRenderControllerMenu',
            'dev.packsmith.mt.GenerateResourcePackMenu',
            'dev.packsmith.mt.GenerateScriptManifestMenu',
            'dev.packsmith.mt.GenerateShapedRecipeMenu',
            'dev.packsmith.mt.GenerateShapelessRecipeMenu',
            'dev.packsmith.mt.GenerateSpawnRulesMenu',
            'dev.packsmith.mt.GenerateTickJsonMenu',
            'dev.packsmith.mt.InsertItemTextureEntryMenu',
            'dev.packsmith.mt.InsertNamespaceMenu',
            'dev.packsmith.mt.InsertQuotedUuidMenu',
            'dev.packsmith.mt.InsertSoundDefinitionMenu',
            'dev.packsmith.mt.InsertTerrainTextureEntryMenu',
            'dev.packsmith.mt.InsertUuidMenu',
            'dev.packsmith.mt.LinkRpFromClipboardMenu',
            'dev.packsmith.mt.MinifyJsonMenu',
            'dev.packsmith.mt.NormalizeIdentifiersMenu',
            'dev.packsmith.mt.PackAuditMenu',
            'dev.packsmith.mt.PixelArtStudioFunction',
            'dev.packsmith.mt.RefreshManifestUuidsMenu',
            'dev.packsmith.mt.ReplaceWithUuidMenu',
            'dev.packsmith.mt.SortJsonKeysMenu',
            'dev.packsmith.mt.ValidateJsonMenu',
            'dev.packsmith.mt.ValidateManifestMenu',
          ]
          lines = [
              'mtPlugin {',
              '    pluginID = "dev.packsmith.mt"',
              '    versionCode = 4',
              '    versionName = "0.2.0"',
              '    name = "PackSmith"',
              '    description = "Bedrock pack workshop: generators, scaffolds, JSON tools, Pixel Art Studio"',
              '    mainPreference = "dev.packsmith.mt.PackSmithPreference"',
              '    interfaces = [',
          ]
          lines += ['        "'+x+'",' for x in interfaces]
          lines += ['    ]','    pushTarget = "auto"','}']
          block='\n'.join(lines)
          p.write_text(s[:start]+block+s[end:])
          print(p.read_text())
          PY2
      - name: Build release MTP
        working-directory: /tmp/mt-demo
        run: ./gradlew template:packageReleaseMtp --stacktrace
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p /tmp/out
          f=$(find /tmp/mt-demo/template/build/outputs/mt-plugin -type f -name '*.mtp' | head -n1)
          test -n "$f"
          cp "$f" /tmp/out/PackSmith-v0.2.0.mtp
          unzip -t /tmp/out/PackSmith-v0.2.0.mtp
          unzip -p /tmp/out/PackSmith-v0.2.0.mtp manifest.json
          sha256sum /tmp/out/PackSmith-v0.2.0.mtp
      - uses: actions/upload-artifact@v4
        with:
          name: PackSmith-v0.2.0
          path: /tmp/out/PackSmith-v0.2.0.mtp
          if-no-files-found: error
