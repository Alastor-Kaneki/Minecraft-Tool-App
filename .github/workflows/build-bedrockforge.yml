name: Build Bedrock Forge

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'bedrockforge/**'
      - 'settings.gradle'
      - '.github/workflows/build-bedrockforge.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle :bedrockforge:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p out
          cp bedrockforge/build/outputs/apk/debug/bedrockforge-debug.apk out/Bedrock-Forge-0.1.28-alpha.apk
          sha256sum out/Bedrock-Forge-0.1.28-alpha.apk | tee out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Forge-0.1.28-alpha
          path: out/
          if-no-files-found: error
