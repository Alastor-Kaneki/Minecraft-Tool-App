name: Bedrock Inventory Editor Build

on:
  push:
    branches:
      - build/bedrock-inventory-editor-mbloader
    paths:
      - 'inventory-editor/**'
      - '.github/workflows/bedrock-inventory-editor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bedrock-inventory-editor-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Inventory-Editor-0.1.2-alpha
          path: inventory-editor/app/build/outputs/apk/debug/app-debug.apk
