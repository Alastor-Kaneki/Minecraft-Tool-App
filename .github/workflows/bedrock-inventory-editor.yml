name: Bedrock Inventory Editor Build

on:
  push:
    branches:
      - build/bedrock-inventory-editor-mbloader
    paths:
      - 'inventory-editor/**'
      - '.github/workflows/bedrock-inventory-editor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: inventory-editor/.signing/debug.keystore
          key: bedrock-inventory-editor-signing-v1

      - name: Create signing keystore if missing
        run: |
          mkdir -p .signing
          if [ ! -f .signing/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore .signing/debug.keystore \
              -storepass android \
              -alias bedrock-inventory-editor \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Bedrock Inventory Editor,O=Alastor Kaneki,C=US'
          fi
          keytool -list -keystore .signing/debug.keystore -storepass android -alias bedrock-inventory-editor

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Inventory-Editor-0.2.0-alpha-storage-signing
          path: inventory-editor/app/build/outputs/apk/debug/app-debug.apk
