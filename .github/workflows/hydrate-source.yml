name: Hydrate Android Source

on:
  push:
    branches: [main]
    paths:
      - source/bootstrap/ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source tree
        shell: bash
        run: |
          if [[ ! -f source/bootstrap/ready ]]; then
            echo "Bootstrap already consumed."
            exit 0
          fi
          cat source/bootstrap/java-src.tar.gz.b64.* | base64 --decode > /tmp/nullforge-java-src.tar.gz
          tar -xzf /tmp/nullforge-java-src.tar.gz -C .
          rm -rf source/bootstrap
      - name: Commit restored source
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add NullForge Android source"
          git push
