name: World Shuttle Build

on:
  push:
    branches: [world-shuttle-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :worldshuttle:assembleDebug --stacktrace
      - name: Collect and verify APK
        run: |
          APK="$(find worldshuttle/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" World-Shuttle-standalone.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs World-Shuttle-standalone.apk | tee worldshuttle-signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: World-Shuttle-standalone
          path: |
            World-Shuttle-standalone.apk
            worldshuttle-signature.txt
