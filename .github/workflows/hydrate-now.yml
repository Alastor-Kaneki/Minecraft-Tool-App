name: Hydrate Merged Source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    if: ${{ hashFiles('source/bootstrap/ready') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore merged Android source
        shell: bash
        run: |
          cat source/bootstrap/java-src.tar.gz.b64.* | base64 --decode > /tmp/nullforge-merged.tar.gz
          tar -xzf /tmp/nullforge-merged.tar.gz -C .
          rm -rf source/bootstrap
      - name: Commit source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add merged Minecraft creator frontend"
          git push
